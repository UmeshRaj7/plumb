include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Fixture projects are inputs for tests, not part of this package.
    - test/fixtures/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - sort_constructors_first
    - unawaited_futures
