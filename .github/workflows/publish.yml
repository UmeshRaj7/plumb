name: publish

# Publishes to pub.dev when a version tag like v0.0.2 is pushed.
# pub.dev only accepts it when automated publishing is enabled for this repo
# (pub.dev → plumb → Admin) and the tag matches the version in pubspec.yaml.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  publish:
    needs: test
    permissions:
      id-token: write # lets pub.dev verify this run came from this repo
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
