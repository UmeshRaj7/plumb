name: plumb
description: >-
  Native config for Flutter™. `plumb doctor` checks your app's Info.plist,
  entitlements and AndroidManifest against what its plugins' docs require.
  Read-only.
version: 0.1.0
repository: https://github.com/UmeshRaj7/plumb
issue_tracker: https://github.com/UmeshRaj7/plumb/issues
topics:
  - flutter
  - cli
  - ios
  - android
  - lint

screenshots:
  - description: >-
      plumb doctor reporting a placeholder purpose string, a missing one and
      the wrong MainActivity base class, each with a fix and a docs link.
    path: assets/plumb-doctor.png

environment:
  sdk: ^3.8.0

executables:
  plumb:

dependencies:
  args: ^2.6.0
  package_config: ">=2.1.1 <4.0.0"
  path: ^1.9.0
  pub_semver: ^2.1.5
  xml: ">=6.5.0 <8.0.0"
  yaml: ^3.1.3

dev_dependencies:
  json_schema: ^5.2.0
  lints: ^6.0.0
  test: ^1.28.0
